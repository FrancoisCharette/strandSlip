[project]
name = "master-rebuild"
version = "0.1.0"
description = "Revival of the 1990 Fortran strand-stiffness programs (SINUS, BSINUS, NSINUS, RAYON, FRICTION, DEPLACE, ENTRE) and the six 1992 thesis programs (HARDRHOB, CONTRHOB, ZETARHOB, HARDSIN, CONTSIN, ZETASIN) as a PySide6 desktop app"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.4,<1",
]

[project.scripts]
master-rebuild = "masterRebuild.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
qt_api = "pyside6"
python_files = ["test*.py"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["masterRebuild", "legacyReference", "listingReader"]

[tool.ruff.lint.per-file-ignores]
# The transcriptions keep the Fortran names (I, X1...) and expressions whole,
# so they can be read against the listings line by line.
"tests/legacyReference/*" = ["E501", "E741"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masterRebuild"]
